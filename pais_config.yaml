project:
  name: "PAIS Agent Reliability Gateway"
  environment: "development"

policy:
  # Unrecognised actions stop for review instead of silently proceeding.
  default_action: "REQUIRE_HUMAN_REVIEW"

policies:
  - name: "block-destructive-shell"
    trigger: "agent_tool_call"
    action: "BLOCK_ACTION"
    priority: 1000
    reason: "Destructive shell operations are denied by policy"
    condition:
      tool: "shell"
      operation:
        in: ["delete", "reset", "destroy"]

  - name: "block-restricted-data-egress"
    trigger: "agent_tool_call"
    action: "BLOCK_ACTION"
    priority: 900
    reason: "Restricted data cannot be sent to an external destination"
    condition:
      data_classification: "restricted"
      destination:
        exists: true

  - name: "review-production-side-effects"
    trigger: "agent_tool_call"
    action: "REQUIRE_HUMAN_REVIEW"
    priority: 500
    reason: "Production side effects require explicit human approval"
    approval_required_from: ["service-owner"]
    escalation_timeout_hours: 4
    condition:
      environment: "production"
      has_side_effect: true

  - name: "review-high-risk-actions"
    trigger: "agent_tool_call"
    action: "REQUIRE_HUMAN_REVIEW"
    priority: 450
    reason: "Actions with a risk score of 70 or above require review"
    approval_required_from: ["risk-owner"]
    condition:
      risk_score:
        gte: 70

  - name: "redact-confidential-contact-data"
    trigger: "agent_tool_call"
    action: "WARN_AND_REDACT"
    priority: 300
    reason: "Configured confidential fields must be removed before execution"
    sensitive_fields: ["email", "phone", "national_id"]
    condition:
      data_classification: "confidential"

  - name: "allow-read-only-non-production"
    trigger: "agent_tool_call"
    action: "ALLOW"
    priority: 100
    reason: "Read-only operation in a non-production environment"
    condition:
      operation:
        in: ["read", "list", "search", "inspect"]
      environment:
        in: ["development", "staging"]

audit:
  log_file: "logs/audit.jsonl"
