[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pais-agent-gateway"
version = "0.1.0"
description = "Open-source reliability gateway for policy-controlled AI-agent tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Richard Ogundele"}]
keywords = ["ai-agents", "reliability", "policy-as-code", "audit", "human-in-the-loop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
redaction = ["pandas>=2.1,<3", "openpyxl>=3.1,<4", "spacy>=3.7,<4"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/richardogundele/PAIS-GOVERNANCE"
Issues = "https://github.com/richardogundele/PAIS-GOVERNANCE/issues"
Source = "https://github.com/richardogundele/PAIS-GOVERNANCE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
omit = ["src/pais_governance/core/redactor.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["src/pais_governance/core/redactor.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
