services:
  pais-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PAIS_CONFIG: /app/pais_config.yaml
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./pais_config.yaml:/app/pais_config.yaml:ro
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
